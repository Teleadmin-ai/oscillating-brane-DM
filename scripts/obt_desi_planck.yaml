# ========================================================
# COBAYA PRODUCTION RUN: OBT V8.2 vs REAL OBSERVATIONS
# Probes: DESI DR2 w(z) + Planck ISW (low-ell) + DES Y6 (S8)
# Launch: mpirun -n 4 cobaya-run scripts/obt_desi_planck.yaml -f
# Expected: ~2.8h wall-clock on 4 cores
# ========================================================

likelihood:
  scripts.obt_v82_likelihood.OBTV82Likelihood:
    python_path: .

params:
  tau0:
    prior:
      min: 1.0e19
      max: 20.0e19
    ref:
      dist: norm
      loc: 7.0e19
      scale: 0.5e19
    proposal: 1.0e18
    latex: \tau_0

  T:
    prior:
      min: 0.5
      max: 5.0
    ref:
      dist: norm
      loc: 2.0
      scale: 0.2
    proposal: 0.1
    latex: T

  L:
    prior:
      min: 1.0e-8
      max: 1.0e-6
    ref:
      dist: norm
      loc: 2.0e-7
      scale: 0.2e-7
    proposal: 1.0e-8
    latex: L

sampler:
  mcmc:
    burn_in: 200
    max_tries: 5000
    learn_proposal: true
    learn_proposal_Rminus1_max: 20.0
    learn_proposal_Rminus1_max_early: 30.0
    Rminus1_stop: 0.01
    measure_speeds: true

output: chains_real/obt_v82_production
