# Site settings
title: Oscillating Brane Cosmology
subtitle: The Cosmic Yoyo Theory - The Universe as a Vibrating Membrane
description: >-
  A unified cosmological theory where the universe is a vibrating 4D membrane
  in 5D Anti-de Sitter space, driven by a hybrid stick-slip motor. Resolves 22
  cosmological anomalies including dark energy, S₈ tension, and Planck ISW.
baseurl: ""
url: "https://higgs-cosmology.com"
author: Romain Provencal

# Build settings
theme: jekyll-theme-minimal
markdown: kramdown
highlighter: rouge

# Math support
kramdown:
  math_engine: mathjax

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Navigation
navigation:
  - title: Home
    url: /
  - title: Theory
    url: /theory/
  - title: Theoretical Foundations
    url: /theoretical-foundations/
  - title: Chronology
    url: /chronology/
  - title: Predictions
    url: /predictions/
  - title: Discoveries
    url: /discoveries/
  - title: Laboratory
    url: /laboratory/
  - title: Tools
    url: /tools/
  - title: Downloads
    url: /downloads/
  - title: Peer Review
    url: /refutation/
  - title: About
    url: /about/

# Social
github_username: Teleadmin-ai
twitter_username: 

# Analytics (optional)
google_analytics: 

# Exclude from build
exclude:
  - scripts/
  - data/
  - notebooks/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - "*.py"
  - "*.npz"
  - vendor/
  - .github/
  - requirements.txt
  - README.md
  - output/
  - romain.md
  - pandoc-3.1.11/
  - pandoc.tar.gz